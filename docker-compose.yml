services:
  postgres:
    image: postgres:16-alpine
    container_name: notion-hmt-postgres
    environment:
      POSTGRES_DB: notion_hmt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - notion_hmt_postgres_data:/var/lib/postgresql/data

volumes:
  notion_hmt_postgres_data:
